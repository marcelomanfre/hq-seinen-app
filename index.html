<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Produção - HQ Seinen</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #fff; padding: 40px; }
        .container { max-width: 700px; margin: 0 auto; background: #2b2b36; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #f9a826; border-bottom: 2px solid #444; padding-bottom: 10px; }
        button { background-color: #f9a826; color: #1e1e24; border: none; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background-color: #e0961f; }
        #painel-status { margin-top: 20px; padding: 15px; background: #1e1e24; border-radius: 5px; border-left: 4px solid #f9a826; min-height: 80px; font-size: 18px; }
        .destaque { color: #f9a826; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mesa de Luz - HQ Seinen</h1>
        <p>Motor de Linha do Tempo: Conectado ao Firebase.</p>
        
        <button id="btn-proximo">Verificar Próximo Capítulo Pendente</button>
        
        <div id="painel-status">
            Aguardando comando...
        </div>
    </div>

    <!-- Importando o seu arquivo JavaScript como Módulo -->
    <script type="module" src="app.js"></script>

</body>
</html>
